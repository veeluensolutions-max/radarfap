<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C222D" />
      <stop offset="100%" stop-color="#101319" />
    </linearGradient>
    <linearGradient id="radarSweep" x1="32" y1="32" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6F53B" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#B6F53B" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#2A3140" stroke-width="2" />

  <!-- Radar Sweep Cone -->
  <path d="M32 32 L32 10 A22 22 0 0 1 51.5 21.5 Z" fill="url(#radarSweep)" />

  <!-- Outer & Inner Radar Rings -->
  <circle cx="32" cy="32" r="21" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" />
  <circle cx="32" cy="32" r="13.5" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="5 3" />

  <!-- Active Radar Arc (Neon Lime) -->
  <path d="M18.5 15.5 A21 21 0 0 1 51.5 23.5" stroke="#B6F53B" stroke-width="3.2" stroke-linecap="round" />

  <!-- Radar Scan Needles -->
  <line x1="32" y1="32" x2="47.5" y2="17" stroke="#B6F53B" stroke-width="2.8" stroke-linecap="round" />
  <line x1="32" y1="32" x2="21" y2="43" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />

  <!-- Center Hub -->
  <circle cx="32" cy="32" r="5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="2.2" fill="#14181F" />

  <!-- Detected Signal Node (FACEPE /PE Highlight) -->
  <circle cx="47.5" cy="17" r="6.5" fill="#B6F53B" fill-opacity="0.28" />
  <circle cx="47.5" cy="17" r="3.8" fill="#B6F53B" stroke="#14181F" stroke-width="1.5" />
</svg>
